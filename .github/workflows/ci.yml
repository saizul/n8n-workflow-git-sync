name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Self-lint the example workflows
        run: node bin/n8n-sync.js lint examples/ --format github --fail-on warning

      - name: Validate the example workflows
        run: node bin/n8n-sync.js validate examples/workflows --strict

      - name: Check the examples for secrets
        run: node bin/n8n-sync.js redact examples/workflows --check
